<aside class="sidebar">
  <div class="brand">
    <span class="brand-icon">🏛️</span>
    <div class="brand-info">
      <span class="brand-name">Library System</span>
      <span class="role-pill" [class.role-admin]="authService.isAdmin()" [class.role-student]="authService.isStudent()">
        {{ authService.isAdmin() ? 'ADMIN CONSOLE' : 'STUDENT PORTAL' }}
      </span>
    </div>
  </div>

  <nav class="nav-menu">
    @for (link of navLinks; track link.path) {
      <a [routerLink]="link.path" routerLinkActive="active" class="nav-item">
        <span class="nav-icon">{{ link.icon }}</span>
        <span class="nav-label">{{ link.label }}</span>
      </a>
    }
  </nav>
</aside>
