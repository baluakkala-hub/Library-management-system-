<div class="modal-overlay">
  <div class="modal-card">
    <div class="modal-header">
      <h3>{{ isEditMode ? 'Edit Book' : 'Add New Book' }}</h3>
      <button class="close-btn" (click)="onCancel()">✕</button>
    </div>

    <form (ngSubmit)="onSubmit()">
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">ISBN Number *</label>
          <input 
            type="text" 
            class="form-control" 
            placeholder="e.g. 978-0132350884" 
            [(ngModel)]="formData.isbn" 
            name="isbn" 
            required 
          />
        </div>

        <div class="form-group">
          <label class="form-label">Book Title *</label>
          <input 
            type="text" 
            class="form-control" 
            placeholder="e.g. Clean Code" 
            [(ngModel)]="formData.title" 
            name="title" 
            required 
          />
        </div>

        <div class="form-group">
          <label class="form-label">Author *</label>
          <input 
            type="text" 
            class="form-control" 
            placeholder="e.g. Robert C. Martin" 
            [(ngModel)]="formData.author" 
            name="author" 
            required 
          />
        </div>

        <div class="form-row">
          <div class="form-group flex-1">
            <label class="form-label">Category</label>
            <input 
              type="text" 
              class="form-control" 
              placeholder="e.g. Computer Science" 
              [(ngModel)]="formData.category" 
              name="category" 
            />
          </div>

          <div class="form-group flex-1">
            <label class="form-label">Total Copies *</label>
            <input 
              type="number" 
              class="form-control" 
              min="1" 
              [(ngModel)]="formData.totalCopies" 
              name="totalCopies" 
              required 
            />
          </div>
        </div>

        <!-- Physical Shelf Location Coordinates -->
        <div class="form-row">
          <div class="form-group flex-1">
            <label class="form-label">📍 Aisle Location</label>
            <input 
              type="text" 
              class="form-control" 
              placeholder="e.g. Aisle 1 (CSE)" 
              [(ngModel)]="formData.aisle" 
              name="aisle" 
            />
          </div>

          <div class="form-group flex-1">
            <label class="form-label">Shelf Bay</label>
            <input 
              type="text" 
              class="form-control" 
              placeholder="e.g. Shelf A1" 
              [(ngModel)]="formData.shelf" 
              name="shelf" 
            />
          </div>

          <div class="form-group flex-1">
            <label class="form-label">Column / Rack</label>
            <input 
              type="text" 
              class="form-control" 
              placeholder="e.g. Rack 1" 
              [(ngModel)]="formData.columnRack" 
              name="columnRack" 
            />
          </div>
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="onCancel()">Cancel</button>
        <button type="submit" class="btn btn-primary" [disabled]="saving">
          {{ saving ? 'Saving...' : (isEditMode ? 'Update Book' : 'Create Book') }}
        </button>
      </div>
    </form>
  </div>
</div>
