<div class="modal-overlay" (click)="onCancel()">
  <div class="modal-card" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <div class="header-titles">
        <span class="editorial-kicker">Catalog Administration</span>
        <h3>{{ isEditMode ? 'Edit Volume Coordinates' : 'Acquire New Volume' }}</h3>
      </div>
      <button type="button" class="modal-close" (click)="onCancel()" aria-label="Close dialog">✕</button>
    </div>

    <form (ngSubmit)="onSubmit()">
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">ISBN Catalog Number *</label>
          <input 
            type="text" 
            class="form-control" 
            placeholder="e.g. 978-0132350884" 
            [(ngModel)]="formData.isbn" 
            name="isbn" 
            required 
          />
        </div>

        <div class="form-group">
          <label class="form-label">Book Title *</label>
          <input 
            type="text" 
            class="form-control" 
            placeholder="e.g. The Structure and Interpretation of Computer Programs" 
            [(ngModel)]="formData.title" 
            name="title" 
            required 
          />
        </div>

        <div class="form-group">
          <label class="form-label">Primary Author / Contributor *</label>
          <input 
            type="text" 
            class="form-control" 
            placeholder="e.g. Harold Abelson & Gerald Jay Sussman" 
            [(ngModel)]="formData.author" 
            name="author" 
            required 
          />
        </div>

        <div class="form-row">
          <div class="form-group flex-1">
            <label class="form-label">Subject / Discipline</label>
            <input 
              type="text" 
              class="form-control" 
              placeholder="e.g. Computer Science" 
              [(ngModel)]="formData.category" 
              name="category" 
            />
          </div>

          <div class="form-group flex-1">
            <label class="form-label">Total Copies in Inventory *</label>
            <input 
              type="number" 
              class="form-control" 
              min="1" 
              [(ngModel)]="formData.totalCopies" 
              name="totalCopies" 
              required 
            />
          </div>
        </div>

        <!-- Physical Shelf Location Coordinates (Section 16) -->
        <div class="shelf-coordinates-panel">
          <span class="panel-tag">Physical Shelf Coordinates</span>
          <div class="form-row">
            <div class="form-group flex-1">
              <label class="form-label">Aisle Corridor</label>
              <input 
                type="text" 
                class="form-control" 
                placeholder="e.g. Aisle 1" 
                [(ngModel)]="formData.aisle" 
                name="aisle" 
              />
            </div>

            <div class="form-group flex-1">
              <label class="form-label">Shelf Row</label>
              <input 
                type="text" 
                class="form-control" 
                placeholder="e.g. Row A" 
                [(ngModel)]="formData.shelf" 
                name="shelf" 
              />
            </div>

            <div class="form-group flex-1">
              <label class="form-label">Rack Column</label>
              <input 
                type="text" 
                class="form-control" 
                placeholder="e.g. Rack 1" 
                [(ngModel)]="formData.columnRack" 
                name="columnRack" 
              />
            </div>
          </div>
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="onCancel()">Cancel</button>
        <button type="submit" class="btn btn-primary" [disabled]="saving">
          {{ saving ? 'Recording...' : (isEditMode ? 'Update Volume' : 'Save to Catalog') }}
        </button>
      </div>
    </form>
  </div>
</div>
