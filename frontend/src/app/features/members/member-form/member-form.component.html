<div class="modal-overlay" (click)="onCancel()">
  <div class="modal-card" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <div class="header-titles">
        <span class="editorial-kicker">Patron Registry</span>
        <h3>{{ isEditMode ? 'Modify Patron Record' : 'Enroll New Scholar' }}</h3>
      </div>
      <button type="button" class="modal-close" (click)="onCancel()" aria-label="Close dialog">✕</button>
    </div>

    <form (ngSubmit)="onSubmit()">
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">Full Legal Name *</label>
          <input 
            type="text" 
            class="form-control" 
            placeholder="e.g. Jane Austen" 
            [(ngModel)]="formData.name" 
            name="name" 
            required 
          />
        </div>

        <div class="form-group">
          <label class="form-label">University Email Address *</label>
          <input 
            type="email" 
            class="form-control" 
            placeholder="e.g. j.austen@oxford.edu" 
            [(ngModel)]="formData.email" 
            name="email" 
            required 
          />
        </div>

        <div class="form-group">
          <label class="form-label">Contact Telephone</label>
          <input 
            type="tel" 
            class="form-control" 
            placeholder="e.g. +1 (555) 234-5678" 
            [(ngModel)]="formData.phone" 
            name="phone" 
          />
        </div>

        <div class="form-group">
          <label class="form-label">Membership Standing</label>
          <select class="form-control" [(ngModel)]="formData.status" name="status">
            <option value="ACTIVE">ACTIVE (In Good Standing)</option>
            <option value="SUSPENDED">SUSPENDED (Overdue Dues)</option>
            <option value="INACTIVE">INACTIVE (Graduated / Archived)</option>
          </select>
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="onCancel()">Cancel</button>
        <button type="submit" class="btn btn-primary" [disabled]="saving">
          {{ saving ? 'Saving...' : (isEditMode ? 'Update Record' : 'Complete Enrollment') }}
        </button>
      </div>
    </form>
  </div>
</div>
