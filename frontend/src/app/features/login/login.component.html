<div class="login-wrapper">
  <!-- Top Right Theme Toggle -->
  <div class="top-actions">
    <button 
      type="button" 
      class="theme-toggle" 
      (click)="themeService.toggleTheme()"
    >
      {{ themeService.isDark() ? 'Daylight' : 'Evening' }}
    </button>
  </div>

  <div class="login-container">
    <!-- Editorial Header -->
    <div class="login-header">
      <div class="brand-monogram">L</div>
      <h1 class="login-title">Library Management System</h1>
      <p class="login-subtitle">Sign in to access the university catalog and borrowing desk</p>
    </div>

    <!-- Role Toggle Bar -->
    <div class="role-selector">
      <button 
        type="button" 
        class="role-pill-btn" 
        [class.active]="selectedRole === 'student'"
        (click)="setRole('student')"
      >
        Scholar Portal
      </button>
      <button 
        type="button" 
        class="role-pill-btn" 
        [class.active]="selectedRole === 'admin'"
        (click)="setRole('admin')"
      >
        Administration
      </button>
    </div>

    <!-- Login Card -->
    <div class="card login-card">
      @if (error) {
        <div class="form-error-banner">
          {{ error }}
        </div>
      }

      <form (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label class="form-label" for="username">
            {{ selectedRole === 'admin' ? 'Administrator Username' : 'Scholar Username' }}
          </label>
          <input 
            id="username"
            name="username"
            type="text" 
            class="form-control" 
            [placeholder]="selectedRole === 'admin' ? 'e.g. admin' : 'e.g. satish'" 
            [(ngModel)]="username"
            required
            autocomplete="username"
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input 
            id="password"
            name="password"
            type="password" 
            class="form-control" 
            placeholder="••••••••" 
            [(ngModel)]="password"
            required
            autocomplete="current-password"
          />
        </div>

        <button 
          type="submit" 
          class="btn btn-primary btn-block" 
          [disabled]="loading"
        >
          {{ loading ? 'Signing in...' : 'Sign In' }}
        </button>
      </form>
    </div>

    <!-- Quiet Credentials Hint -->
    <div class="credentials-hint">
      <span class="text-caption">Default accounts: <code>admin / admin123</code> · <code>satish / student123</code></span>
    </div>
  </div>
</div>
