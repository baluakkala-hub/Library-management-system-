<div class="modal-overlay">
  <div class="modal-card">
    <div class="modal-header">
      <h3>Issue a Book to Member</h3>
      <button class="close-btn" (click)="onCancel()">✕</button>
    </div>

    <form (ngSubmit)="onSubmit()">
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">Select Book (In Stock Only) *</label>
          <select class="form-control" [(ngModel)]="formData.bookId" name="bookId" required>
            <option [ngValue]="0" disabled selected>-- Select a Book --</option>
            @for (b of books; track b.id) {
              <option [ngValue]="b.id">{{ b.title }} ({{ b.availableCopies }} available) - ISBN: {{ b.isbn }}</option>
            }
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Select Borrower (Active Members Only) *</label>
          <select class="form-control" [(ngModel)]="formData.memberId" name="memberId" required>
            <option [ngValue]="0" disabled selected>-- Select a Member --</option>
            @for (m of members; track m.id) {
              <option [ngValue]="m.id">{{ m.name }} ({{ m.email }})</option>
            }
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Loan Duration (Days)</label>
          <input 
            type="number" 
            class="form-control" 
            min="1" 
            max="60" 
            [(ngModel)]="formData.loanDays" 
            name="loanDays" 
          />
          <small class="hint-text">Standard loan period is 14 days.</small>
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="onCancel()">Cancel</button>
        <button type="submit" class="btn btn-primary" [disabled]="issuing">
          {{ issuing ? 'Issuing...' : 'Confirm Book Issue' }}
        </button>
      </div>
    </form>
  </div>
</div>
