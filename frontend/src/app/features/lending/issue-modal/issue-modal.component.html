<div class="modal-overlay" (click)="onCancel()">
  <div class="modal-card" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <div class="header-titles">
        <span class="editorial-kicker">Circulation Desk</span>
        <h3>Issue Volume on Loan</h3>
      </div>
      <button type="button" class="modal-close" (click)="onCancel()" aria-label="Close dialog">✕</button>
    </div>

    <form (ngSubmit)="onSubmit()">
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">Select Volume (Available In Inventory) *</label>
          <select class="form-control" [(ngModel)]="formData.bookId" name="bookId" required>
            <option [ngValue]="0" disabled selected>-- Select a Volume from Stacks --</option>
            @for (b of books; track b.id) {
              <option [ngValue]="b.id">{{ b.title }} · {{ b.author }} ({{ b.availableCopies }} available) - ISBN: {{ b.isbn }}</option>
            }
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Borrowing Scholar / Patron *</label>
          <select class="form-control" [(ngModel)]="formData.memberId" name="memberId" required>
            <option [ngValue]="0" disabled selected>-- Select an Active Patron --</option>
            @for (m of members; track m.id) {
              <option [ngValue]="m.id">{{ m.name }} ({{ m.email }})</option>
            }
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Loan Duration (Standard: 14 Days)</label>
          <input 
            type="number" 
            class="form-control" 
            min="1" 
            max="60" 
            [(ngModel)]="formData.loanDays" 
            name="loanDays" 
          />
          <span class="hint-caption">Calculates the return deadline date automatically upon authorization.</span>
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="onCancel()">Cancel</button>
        <button type="submit" class="btn btn-primary" [disabled]="issuing">
          {{ issuing ? 'Authorizing Loan...' : 'Authorize Book Issue' }}
        </button>
      </div>
    </form>
  </div>
</div>
